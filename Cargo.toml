# SPDX-License-Identifier: Apache-2.0
# The host workspace of Files: the portable crates (files-core, neo-fs, files-ops, neo-view; Apache-2.0) and the Slint UI
# (files-ui, GPL-3.0: it links Slint), tested on the host. The app EXE is the separate symbian/ workspace (armv5te,
# nightly build-std).
[workspace]
resolver = "3"
members = ["crates/files-core", "crates/files-ui", "crates/neo-fs", "crates/files-ops", "crates/neo-view", "crates/neo-format-text", "crates/neo-format-image", "crates/neo-format-archive"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
neo-fs = { path = "crates/neo-fs" }
files-ops = { path = "crates/files-ops" }
files-core = { path = "crates/files-core" }
neo-view = { path = "crates/neo-view" }
neo-format-text = { path = "crates/neo-format-text" }
neo-format-image = { path = "crates/neo-format-image" }
neo-format-archive = { path = "crates/neo-format-archive" }
files-ui = { path = "crates/files-ui" }
# NeoSymbian/neoui: the kit (the shared theme, fonts and components, as a build helper); the same rev as symbian/
neoui-kit = { git = "https://github.com/NeoSymbian/neoui", rev = "a73ace8f2b9c8252c8bd63a0c39f1b9d92b6dc29" }
# the same Slint as neoui (one copy in the ROM, no_std)
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
png = "=0.18.1"
