# SPDX-License-Identifier: Apache-2.0
# Host: the model's tests and the screens' snapshots (uploaded for review). ARM: NEOFILES.EXE's staticlib builds.
# The ROM boot (Syborg) is neoui's syborg job: it clones this repo and taps through Files.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots/*.png
  arm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symbian
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      # ARMv8-A AArch32 with VFP/NEON, softfp (US4): targets/armv8a-neosymbian-eabi.json
      - run: cargo clippy-arm --workspace --locked -- -D warnings
      - run: cargo arm --locked
