# SPDX-License-Identifier: Apache-2.0
[package]
name = "neo-format-media"
description = "Audio and video for Files: probe, tags, containers (MP4, Matroska) and decoders, streamed from the file"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# its ReadAt: random access to the file, shared with the archives
neo-format-archive.workspace = true
# FA12 video: the containers and the decoders, all pure Rust and no_std (NeoSymbian forks where they needed changes)
# the canary: 2026.5.0 has no edit list (B-frame and AAC-priming offsets)
shiguredo_mp4 = { version = "=2026.6.0-canary.3", optional = true }
rust_h264 = { git = "https://github.com/NeoSymbian/rust_h264", rev = "4e9f47b4febe23dbea66f7e808d0577be25d70ff", default-features = false, optional = true }
vp8-decoder = { git = "https://github.com/NeoSymbian/vp8", rev = "e8bb46e8bd0ab0e5431c7da2fe7c207e53d3b500", default-features = false, optional = true }
rusty_vp9 = { git = "https://github.com/NeoSymbian/rusty_vp9", rev = "570deeeabe7530b28c7c682e9e16d090a619ce40", default-features = false, optional = true }
# MPL-2.0: symphonia's no_std branch (PR #553)
symphonia-core = { git = "https://github.com/NeoSymbian/Symphonia", rev = "a8f221f7d99078be597bef205bff54b52bdb2d4e", default-features = false, features = ["no_std"], optional = true }
symphonia-codec-aac = { git = "https://github.com/NeoSymbian/Symphonia", rev = "a8f221f7d99078be597bef205bff54b52bdb2d4e", default-features = false, features = ["no_std"], optional = true }
symphonia-codec-vorbis = { git = "https://github.com/NeoSymbian/Symphonia", rev = "a8f221f7d99078be597bef205bff54b52bdb2d4e", default-features = false, features = ["no_std"], optional = true }
opus-rs = { version = "=0.1.42", default-features = false, features = ["libm"], optional = true }

[features]
default = ["video"]
video = ["dep:shiguredo_mp4", "dep:rust_h264", "dep:vp8-decoder", "dep:rusty_vp9", "dep:symphonia-core", "dep:symphonia-codec-aac", "dep:symphonia-codec-vorbis", "dep:opus-rs"]

[dev-dependencies]
sha2 = { version = "0.11", default-features = false }
