# SPDX-License-Identifier: GPL-3.0-only
# GPL-3.0 because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06), like neoui's apps.
[package]
name = "files-ui"
description = "The Files app's screens in Slint (no_std): drives, folders, selection, copy and move, forms, the text viewer"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
slint = { workspace = true }
# a row from the model, as the app and the snapshot tests both make it
files-core = { workspace = true }
# FA12: the picture's fit and turn (av::yuv)
neo-format-media = { workspace = true }
neo-view = { workspace = true }
# the text model, highlighting and layout behind the viewer and the editors (FA4)
neo-format-text = { workspace = true }
# images as pixels (FA5): the viewer, the editor and the thumbnails become slint::Images here
neo-format-image = { workspace = true }
# cards and events (FA7): the vCard and iCal views and forms are made from them here
neo-format-pim = { workspace = true }
# fonts, certificates, packages and hex (FA7)
neo-format-inspect = { workspace = true }

# documents (FA10): EPUB, docx, odt, rtf and xlsx, laid out here at the advances Slint draws
neo-format-document = { workspace = true }
# float maths without std (the PDF viewer's page sizes)
libm = "0.2"

[build-dependencies]
# the neoui kit (@neoui/kit.slint): theme, fonts, glyphs and components
neoui-kit = { workspace = true }
# the document faces' advances, measured at build time (advances.rs)
ttf-parser = "0.25"

[dev-dependencies]
png = { workspace = true }
