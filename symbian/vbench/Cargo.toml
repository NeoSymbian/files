# SPDX-License-Identifier: GPL-3.0-only
# FA12 V0: VBENCH.EXE, a test-only decoder benchmark (docs files-app.md FA12). Not in the phone's ROM: test images only.
[package]
name = "vbench"
description = "Decodes the clips in C:\\Data\\fa12\\ on an A75 and an A55 and prints frames per second"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib"]
test = false

[dependencies]
neo-format-media.workspace = true
e32.workspace = true
neo-fs.workspace = true
fs-e32.workspace = true
rust_h264 = { git = "https://github.com/NeoSymbian/rust_h264", rev = "77b87a5a17f6882ddfa9106205f32ff0b62d59c4", default-features = false }
vp8-decoder = { git = "https://github.com/NeoSymbian/vp8", rev = "e8bb46e8bd0ab0e5431c7da2fe7c207e53d3b500", default-features = false }
rusty_vp9 = { git = "https://github.com/NeoSymbian/rusty_vp9", rev = "108144251907edbfd97415912c81d1a545c8fa70", default-features = false }
