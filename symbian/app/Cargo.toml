# SPDX-License-Identifier: GPL-3.0-only
# The Files app (NEOFILES.EXE), v2: browse, copy and move, the Recycle bin (docs files-app.md FA1 + FA2).
[package]
name = "neofiles"
description = "The Files app: drives and folders as a list or a grid, copy and move on a worker, the Recycle bin with Undo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib"]
test = false

[dependencies]
e32.workspace = true
neoui-proto.workspace = true
slint.workspace = true
neoapp.workspace = true
files-core.workspace = true
files-ui.workspace = true
files-ops.workspace = true
neo-fs.workspace = true
neo-view.workspace = true
neo-format-text.workspace = true
neo-format-image.workspace = true
neo-format-archive.workspace = true
neo-format-pim.workspace = true
neo-format-inspect.workspace = true
# NEOCONT's book format and import rule (Apache): the cards Contacts has are marked before Add to Contacts
contacts.workspace = true
fs-e32.workspace = true
# the pinch's distance (soft-float, no std)
libm = "0.2"

[features]
# Pixel test images only: writes C:\Data\big.log (5 MB, FA4), C:\Data\photos\ (FA5) and C:\Data\zips\ (FA6) at start
test-files = []
