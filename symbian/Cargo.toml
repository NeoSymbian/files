# SPDX-License-Identifier: GPL-3.0-only
# NEOFILES.EXE (Files): built only for targets/armv8a-neosymbian-eabi.json with a pinned nightly (build-std), like neoui/symbian.
# GPL-3.0 because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06). The pins must match neoui's: one e32
# (it defines the global allocator) and one Slint in the ROM.
[workspace]
resolver = "3"
members = ["app", "fs-e32", "vbench"]

[workspace.dependencies]
e32 = { git = "https://github.com/NeoSymbian/e32-rs", rev = "206b6c28cf49ef2f6e746580df97f05921500c35", features = ["critical-section"] }
neoui-proto = { git = "https://github.com/NeoSymbian/neoui", rev = "222c43f8116a6dba9ff170997ae7dc0feef055a0" }
neoapp = { git = "https://github.com/NeoSymbian/neoui", rev = "222c43f8116a6dba9ff170997ae7dc0feef055a0" }
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
files-core = { path = "../crates/files-core" }
neo-fs = { path = "../crates/neo-fs" }
neo-view = { path = "../crates/neo-view" }
neo-format-text = { path = "../crates/neo-format-text" }
neo-format-image = { path = "../crates/neo-format-image" }
neo-format-archive = { path = "../crates/neo-format-archive" }
neo-format-pim = { path = "../crates/neo-format-pim" }
neo-format-inspect = { path = "../crates/neo-format-inspect" }
neo-format-media = { path = "../crates/neo-format-media" }
neo-format-document = { path = "../crates/neo-format-document" }
# NeoSymbian/phone's contacts model (Apache): the vCard import and the book NEOCONT writes
contacts = { git = "https://github.com/NeoSymbian/phone", rev = "add6e2449050e0aace786e5d41d8c468886aa1a1" }
files-ops = { path = "../crates/files-ops" }
fs-e32 = { path = "fs-e32" }
# NeoSymbian/neohw: the NeoAudio contract (AUDIOD.EXE plays the player's PCM; Apache-2.0), at neoui's pin
neoaudio = { git = "https://github.com/NeoSymbian/neohw", rev = "9b3853bdc56c0bef6bcf34cbc5cf0c1f18e39fb5" }
files-ui = { path = "../crates/files-ui" }

[profile.release]
panic = "abort"
opt-level = 3
codegen-units = 1
lto = true

[profile.dev]
panic = "abort"
